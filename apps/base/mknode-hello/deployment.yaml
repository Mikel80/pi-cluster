apiVersion: apps/v1
kind: Deployment
metadata:
  name: mknode-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mknode-hello
  template:
    metadata:
      labels:
        app: node-hello
    spec:
      containers:
        - name: mknode-hello
          image: mikedev80/mknode-hello:latest
          ports:
            - containerPort: 3030